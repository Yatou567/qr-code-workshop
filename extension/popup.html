<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码工坊</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><strong>▦ 二维码工坊</strong><span>把当前页面，轻松带走</span></div><small>● 本地生成</small></header>
<main><section class="preview"><div class="section-head"><b id="source">当前网页</b><span id="state" role="status">准备中</span></div><div class="qr"><canvas id="canvas" width="1024" height="1024" role="img" aria-label="二维码"></canvas><span id="placeholder" hidden>输入内容即可生成</span></div><p id="payload"></p><div class="actions"><button id="png" disabled>下载 PNG</button><button id="svg" disabled>下载 SVG</button></div><p id="error" role="alert"></p><label for="input">自定义网址 / 文字</label><textarea id="input" placeholder="在这里输入或粘贴，实时生成二维码" spellcheck="false"></textarea><div class="input-foot"><span>支持中文、网址、普通文字</span><span id="bytes">0 字节</span></div></section>
<section class="links"><div class="section-head"><b>网页中的链接 <span id="total">0</span></b><button class="text-button" id="refresh">刷新</button></div><button id="current" class="current"><span class="tag">当前网页</span><strong id="page-title">正在读取…</strong><span id="page-url"></span></button><input type="search" id="search" placeholder="搜索链接名称或网址" aria-label="搜索页面链接"><div class="list-head"><span>鼠标悬停预览 · 点击保留</span><span id="shown"></span></div><div id="notice" role="status"></div><div id="list"></div></section></main><footer>二维码在本机生成，无上传。扫描网址后访问内容需要联网。</footer><script src="qrcode.js"></script><script src="extract.js"></script><script src="popup.js"></script></body></html>
